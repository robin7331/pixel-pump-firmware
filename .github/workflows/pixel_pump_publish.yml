# pixel_pump_publish: Publish click on a reviewed draft → object store + feed.
#
# pixel_pump_main.yml builds on tag push and creates a DRAFT release as its
# last step — the draft (and its firmware.uf2 asset) only exists if the build
# was green. Publishing that draft fires this workflow, which puts the UF2s in
# the object store and then POSTs the MANIFEST ALONE (~2 KB) to the website.
# Ingest proves the bytes are there with its own anonymous HEAD per file, then
# records and flips the feed in one transaction — so a failed publish published
# nothing and the previous release keeps serving. Contract: issue #34, amended
# by #36 (release notes live in the manifest's releaseNotes, nowhere else) and
# #37 (artifacts move to object storage, `files[]` in the POST is now a 422) /
# robins-tools/robins-tools-website#12, #13. The line is the PP1 sibling of
# PP2's, byte-identical in shape — only the URL prefix, the token, the store
# prefix and the artifact filenames differ. Ported from
# pixel-pump-two-firmware's workflow of the same name; keep the two in step —
# #36 and #37 are both still owed there (pixel-pump-two-firmware#8, #10).
#
# Secrets required:
#   PIXEL_PUMP_ONE_FIRMWARE_RELEASE_TOKEN  shared ingest secret — same value as
#                                          the website's Forge env var of the
#                                          same name. Note the ONE: the URL
#                                          slug is pixel-pump-firmware, the
#                                          token is not.
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
#                                          write keys for the artifact bucket.
#                                          The website holds no credentials at
#                                          all — it only ever reads the store,
#                                          anonymously.
#
# Variables required (public values, deliberately not secrets — they end up in
# the served feed for every client to see):
#   RELEASE_STORE_ENDPOINT  the store, either as its S3 API endpoint
#                           (https://fsn1.your-objectstorage.com) or as the
#                           bucket's own public base
#                           (https://<bucket>.fsn1.your-objectstorage.com) —
#                           the job normalizes between the two.
#   RELEASE_STORE_BUCKET    bucket name. Its public base
#                           (https://<bucket>.<endpoint host>) must be exactly
#                           the website's RELEASE_ARTIFACT_BASE, and the bucket
#                           must be public-read — Hetzner buckets are private
#                           by default, and a private one fails ingest, not us.
#
# Both are also read from secrets of the same name if no variable is set, which
# is how they are configured today. Nothing here is sensitive — the bucket and
# its host end up in the served feed — but as secrets they are masked in the
# logs, so a base mismatch reads as `***` in the errors below. Moving them to
# variables is the only reason to care.

name: Pixel Pump Publish

on:
  release:
    types: [published]
  # Recovery path: a release event snapshots the workflow file at the tag's
  # commit, so a workflow fix landed on main after a failed publish can only
  # run via manual dispatch.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.2)"
        required: true

permissions:
  contents: read

concurrency:
  group: pixel-pump-publish-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  INGEST_URL: https://robins-tools.com/downloads/pixel-pump-firmware/releases
  FEED_URL: https://robins-tools.com/downloads/pixel-pump-firmware/latest.yml
  # Objects mirror the URL they are served at: <base>/<line-slug>/<file>, flat,
  # no version directory — the filenames already carry the version. The prefix
  # must stay free of anything version-like (issue #37 / website #13).
  STORE_PREFIX: pixel-pump-firmware
  STORE_ENDPOINT: ${{ vars.RELEASE_STORE_ENDPOINT || secrets.RELEASE_STORE_ENDPOINT }}
  STORE_BUCKET: ${{ vars.RELEASE_STORE_BUCKET || secrets.RELEASE_STORE_BUCKET }}

jobs:
  publish:
    # Also what keeps this repo's dead tags out of the feed — `latest` (the
    # retired dev workflow's rolling prerelease) and the stray `false` do not
    # start with 'v', so publishing either is a no-op rather than a bad ingest.
    if: startsWith(github.event.release.tag_name || github.event.inputs.tag, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

    steps:
      - name: Assert ingest secret exists
        env:
          TOKEN: ${{ secrets.PIXEL_PUMP_ONE_FIRMWARE_RELEASE_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::PIXEL_PUMP_ONE_FIRMWARE_RELEASE_TOKEN secret is missing — set it with 'gh secret set PIXEL_PUMP_ONE_FIRMWARE_RELEASE_TOKEN', same value as the website's Forge env var of the same name (issue #34)"; exit 1; }

      # Fail here rather than three steps in with an AWS CLI backtrace, and
      # settle the one ambiguity in how the store can be named: Hetzner's API
      # endpoint is the bare location host, while the *bucket's* public base —
      # what the website holds as RELEASE_ARTIFACT_BASE — is that host with the
      # bucket as a subdomain. Either spelling is accepted for
      # RELEASE_STORE_ENDPOINT and both derive the same pair, because the AWS
      # CLI needs the location host (it adds the bucket itself) and the checks
      # below need the public base. Getting that backwards would upload to
      # <bucket>.<bucket>.… and fail only after the POST.
      #
      # The public base must come out equal to the website's
      # RELEASE_ARTIFACT_BASE — that is what ingest HEADs and what the served
      # feed hands to Board Factory; the verify steps below are what prove the
      # two agree. The signing region is the location label (e.g. fsn1) unless
      # RELEASE_STORE_REGION says otherwise; a wrong one fails the upload
      # loudly, at signature check.
      - name: Assert object store configuration exists
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          REGION_OVERRIDE: ${{ vars.RELEASE_STORE_REGION }}
        run: |
          [ -n "$STORE_ENDPOINT" ] || { echo "::error::RELEASE_STORE_ENDPOINT is missing — set it (variable or secret) to the store's endpoint, e.g. https://fsn1.your-objectstorage.com (issue #37)"; exit 1; }
          [ -n "$STORE_BUCKET" ] || { echo "::error::RELEASE_STORE_BUCKET is missing — set it (variable or secret) to the artifact bucket's name (issue #37)"; exit 1; }
          [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] \
            || { echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets are missing — the bucket's write keys (issue #37)"; exit 1; }
          host="${STORE_ENDPOINT#*://}"
          host="${host%/}"
          # Given the bucket's public base, strip the bucket back off for the
          # API. An `&&` one-liner would be a `set -e` landmine here: the common
          # case makes the test false, which would end the step.
          if [ "${host%%.*}" = "$STORE_BUCKET" ]; then
            host="${host#*.}"
          fi
          echo "STORE_BASE=https://$STORE_BUCKET.$host" >> "$GITHUB_ENV"
          echo "STORE_API=https://$host" >> "$GITHUB_ENV"
          echo "AWS_REGION=${REGION_OVERRIDE:-${host%%.*}}" >> "$GITHUB_ENV"
          echo "store: s3://$STORE_BUCKET/$STORE_PREFIX/ via https://$host"

      # The device reports exactly major.minor.patch over USB — a prerelease
      # suffix cannot exist on the wire, so none may reach the feed. This
      # repo's legacy malformed tag v.0.0.4 must fail here.
      - name: Derive version from tag
        run: |
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::'$version' (from tag $TAG) is not strict major.minor.patch semver"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Both UF2s go to the store (issue #37 names both objects), but only
      # firmware.uf2 is listed in the manifest and therefore reachable through
      # the feed: firmware-blank.uf2 is the development image and stays a
      # GitHub-release artifact as far as any client is concerned. The assets
      # only exist if the pixel_pump_main.yml build was green, so a
      # hand-created release with no build behind it fails here, before
      # anything is pushed anywhere.
      - name: Download firmware from release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern firmware.uf2 --pattern firmware-blank.uf2 --dir assets
          for f in firmware.uf2 firmware-blank.uf2; do
            test -f "assets/$f" || { echo "::error::$f missing from the release assets — was this draft created by pixel_pump_main.yml?"; exit 1; }
          done
          mv assets/firmware.uf2 "assets/pixel-pump-firmware-$VERSION.uf2"
          mv assets/firmware-blank.uf2 "assets/pixel-pump-firmware-blank-$VERSION.uf2"
          echo "ARTIFACT=pixel-pump-firmware-$VERSION.uf2" >> "$GITHUB_ENV"
          echo "BLANK_ARTIFACT=pixel-pump-firmware-blank-$VERSION.uf2" >> "$GITHUB_ENV"
          ls -lh assets/

      # The release body is polished markdown and travels as markdown: the
      # manifest's releaseNotes is the ONLY place notes live (issue #36), and
      # the site serves it exactly as ingested — no rendering, no flattening,
      # so there is nothing to convert. Fetched via gh (works for both
      # triggers) and written straight to a file — free-form text that may
      # contain quotes/backticks is never string-interpolated.
      - name: Fetch release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
            | tr -d '\r' > release-body.md
          # a bodyless release yields a lone newline — normalize to truly
          # empty so the -s guard (no releaseNotes key) holds
          [ -z "$(tr -d '[:space:]' < release-body.md)" ] && : > release-body.md
          echo "== release notes (markdown):"
          cat release-body.md

      # The manifest is the whole release now — since #36 it carries the notes,
      # and since #37 it is the entire POST. CI is the author; the site records
      # it as sent and rewrites only `files[].url` on the way out.
      #
      # `size` is load-bearing rather than decorative since #37: ingest HEADs
      # every listed object and 422s (`artifacts`) unless Content-Length agrees,
      # and 422s (`yml`) if an entry has no size at all — so it must stay a bare
      # int, which is why it is env() and not strenv(). `sha512` is no longer
      # verified server-side (the site never sees the bytes); it is still
      # recorded and served, for whatever flashes the image to check.
      # releaseNotes is omitted entirely when the body is empty — present but
      # not a string is a 422 on `yml`. Serialized with yq, never
      # hand-templated: notes are arbitrary text (colons, quotes, newlines).
      # No electron-updater legacy fields.
      - name: Generate latest.yml
        run: |
          export SHA512="$(openssl dgst -sha512 -binary "assets/$ARTIFACT" | base64 -w0)"
          export SIZE="$(stat -c%s "assets/$ARTIFACT")"
          export DATE="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          yq -n '
            .version = strenv(VERSION) |
            .files = [{"url": strenv(ARTIFACT), "sha512": strenv(SHA512), "size": env(SIZE)}] |
            .releaseDate = strenv(DATE)
          ' > latest.yml
          if [ -s release-body.md ]; then
            NOTES="$(cat release-body.md)" yq -i '.releaseNotes = strenv(NOTES)' latest.yml
          fi
          echo "== final latest.yml:"
          cat latest.yml

      # Every file the manifest lists must be in the store BEFORE the POST —
      # ingest HEADs each one and 422s if it is missing (issue #37). Uploading
      # first also means a re-run is harmless: object writes are idempotent
      # per (version, filename), and nothing is published until the POST.
      #
      # No --acl: the bucket is public-read at the bucket level, and object
      # ACLs are not how that is granted here. The AWS CLI is preinstalled on
      # ubuntu-latest. Whether it addresses the endpoint path- or virtual-host
      # style is its own business — bucket + key decide where the object lands,
      # and the next step reads it back at the url a client will use.
      - name: Upload artifacts to object storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          for f in "$ARTIFACT" "$BLANK_ARTIFACT"; do
            aws s3 cp "assets/$f" "s3://$STORE_BUCKET/$STORE_PREFIX/$f" \
              --endpoint-url "$STORE_API" --no-progress
          done

      # The same anonymous HEAD ingest is about to do, run here so a store
      # misconfiguration is named by its own step instead of arriving as a 422
      # on `artifacts` after the POST. It is also the only check that the bucket
      # is genuinely public-read: a private bucket answers 403 to this and the
      # website's read alike. Driven off the manifest rather than a filename, so
      # a second listed file would be covered without touching this step.
      - name: Verify the store serves what the manifest lists
        run: |
          while IFS= read -r name; do
            size="$(NAME="$name" yq '.files[] | select(.url == strenv(NAME)) | .size' latest.yml)"
            url="$STORE_BASE/$STORE_PREFIX/$name"
            headers="$(curl -sfSI --max-time 30 "$url")" \
              || { echo "::error::'$name' is not readable at $url — is the bucket public-read, and does its base match the website's RELEASE_ARTIFACT_BASE?"; exit 1; }
            # HTTP/2 lowercases header names, HTTP/1.1 does not — match either.
            # No header at all leaves it empty, which the compare then names.
            length="$(printf '%s' "$headers" | tr -d '\r' | grep -i '^content-length:' | tail -1 | cut -d' ' -f2)" || true
            [ "$length" = "$size" ] \
              || { echo "::error::stored '$name' is $length bytes, the manifest says $size"; exit 1; }
            echo "store serves $name ($size bytes)"
          done < <(yq '.files[].url' latest.yml)

      # ~2 KB: the version and the manifest, nothing else. Two fields that used
      # to be here must never come back — `files[]` is a 422 on `files` since
      # #37 (the bytes are in the store; a pipeline still uploading them is one
      # that never uploaded them anywhere), and `notes` is silently ignored
      # since #36 (such a release publishes 201 with its notes going nowhere).
      # No auto-retry: republish-is-replace makes a manual re-run safe, and
      # ingest is atomic — a failed POST published nothing.
      #
      # A 422 on `files` *required* rather than rejected means the reverse
      # mismatch: the site has not been switched to a store yet
      # (RELEASE_ARTIFACT_BASE unset on Forge), and this workflow is ahead of it.
      - name: POST release to website ingest
        env:
          TOKEN: ${{ secrets.PIXEL_PUMP_ONE_FIRMWARE_RELEASE_TOKEN }}
        run: |
          curl -sS --fail-with-body \
            --max-time 60 \
            -H "Authorization: Bearer $TOKEN" \
            -F "version=$VERSION" \
            -F "yml=@latest.yml" \
            "$INGEST_URL"

      - name: Verify production feed
        run: |
          curl -sfS "$FEED_URL" -o served.yml
          echo "== served feed:"
          cat served.yml
          served_version="$(yq '.version' served.yml)"
          [ "$served_version" = "$VERSION" ] \
            || { echo "::error::feed serves '$served_version', expected '$VERSION'"; exit 1; }
          # What Board Factory actually downloads: since #37 the served url is
          # an absolute store url, rewritten at serve time from the bare
          # filename we uploaded. Check the exact string the client will fetch,
          # not one we compose — a base that disagrees with where CI uploaded
          # shows up here and nowhere else.
          served_url="$(yq '.files[0].url' served.yml)"
          case "$served_url" in
            "$STORE_BASE/$STORE_PREFIX/$ARTIFACT") ;;
            *) echo "::error::feed points at '$served_url', expected '$STORE_BASE/$STORE_PREFIX/$ARTIFACT' — the site's RELEASE_ARTIFACT_BASE and this repo's store variables disagree"; exit 1 ;;
          esac
          curl -sfSI "$served_url" -o /dev/null \
            || { echo "::error::the feed's artifact url '$served_url' is not downloadable"; exit 1; }
          # The site's own route stays alive, streaming from the store: human
          # download links, anything hardcoded, and the rollback if absolute
          # urls ever misbehave on a client. Worth one HEAD.
          curl -sfSI "${FEED_URL%latest.yml}$ARTIFACT" -o /dev/null \
            || { echo "::error::artifact '$ARTIFACT' is in the feed but not downloadable from the site route"; exit 1; }
          # The failure #36 exists to catch: notes that ingest accepts and the
          # feed never shows. Served shape is the [{version, note}] list over
          # the whole line, newest first — so our own entry must carry a note
          # whenever we uploaded one.
          if [ -s release-body.md ]; then
            served_note="$(yq '.releaseNotes[] | select(.version == strenv(VERSION)) | .note' served.yml)"
            [ -n "$served_note" ] && [ "$served_note" != "null" ] \
              || { echo "::error::feed serves no notes for $VERSION — the manifest's releaseNotes key did not reach the feed (issue #36)"; exit 1; }
            echo "feed serves notes for $VERSION"
          fi
          echo "feed serves $served_version and '$ARTIFACT' answers — publish complete"
